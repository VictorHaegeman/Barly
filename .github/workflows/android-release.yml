name: Android Release (AAB)

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: "Publish directly to Google Play"
        required: true
        default: false
        type: boolean
      play_track:
        description: "Google Play track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Missing secret: SUPABASE_URL" && exit 1)
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || (echo "Missing secret: SUPABASE_ANON_KEY" && exit 1)
          test -n "${{ secrets.ANDROID_MAPS_API_KEY }}" || (echo "Missing secret: ANDROID_MAPS_API_KEY" && exit 1)
          test -n "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" || (echo "Missing secret: ANDROID_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore Android keystore
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Generate Android signing files
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase hardening before release
        shell: pwsh
        run: |
          ../scripts/verify_supabase_hardening.ps1 `
            -SupabaseUrl "${{ secrets.SUPABASE_URL }}" `
            -AnonKey "${{ secrets.SUPABASE_ANON_KEY }}" `
            -FailOnCheck

      - name: Build signed Android App Bundle
        env:
          ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab

  publish-play:
    if: ${{ inputs.publish_to_play == true }}
    runs-on: ubuntu-latest
    needs: build-aab
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: release

      - name: Validate Play secret
        run: |
          test -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" || (echo "Missing secret: PLAY_SERVICE_ACCOUNT_JSON" && exit 1)

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.barly.app
          releaseFiles: release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
