name: Android Release (AAB)

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: "Publish directly to Google Play"
        required: true
        default: false
        type: boolean
      play_track:
        description: "Google Play track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Missing secret: SUPABASE_URL" && exit 1)
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || (echo "Missing secret: SUPABASE_ANON_KEY" && exit 1)
          test -n "${{ secrets.ANDROID_MAPS_API_KEY }}" || (echo "Missing secret: ANDROID_MAPS_API_KEY" && exit 1)
          test -n "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" || (echo "Missing secret: ANDROID_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          # Decode the keystore in a resilient way:
          # - strip whitespace
          # - accept base64url (-/_)
          # - auto-pad
          # - provide diagnostics without printing the secret
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          raw = os.environ.get("KEYSTORE_B64", "")
          clean = re.sub(r"\s+", "", raw).strip().strip('"').strip("'")
          # Tolerate base64url variants
          clean = clean.replace("-", "+").replace("_", "/")
          # Auto-pad to multiple of 4
          clean += "=" * (-len(clean) % 4)

          if not clean:
            print("ANDROID_UPLOAD_KEYSTORE_BASE64 is empty after cleanup.")
            sys.exit(1)

          if not re.fullmatch(r"[A-Za-z0-9+/=]+", clean):
            bad = re.findall(r"[^A-Za-z0-9+/=]", clean)
            print(
              f"ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64 "
              f"(len={len(clean)}, invalid_chars={len(bad)})."
            )
            sys.exit(1)

          try:
            data = base64.b64decode(clean, validate=False)
          except Exception as e:
            print(f"ANDROID_UPLOAD_KEYSTORE_BASE64 decode failed: {e}")
            sys.exit(1)

          out_path = "android/upload-keystore.jks"
          os.makedirs(os.path.dirname(out_path), exist_ok=True)
          with open(out_path, "wb") as f:
            f.write(data)

          print(f"Decoded keystore bytes: {len(data)}")
          PY

          test -s android/upload-keystore.jks

      - name: Generate Android signing files
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase hardening before release
        shell: pwsh
        run: |
          ../scripts/verify_supabase_hardening.ps1 `
            -SupabaseUrl "${{ secrets.SUPABASE_URL }}" `
            -AnonKey "${{ secrets.SUPABASE_ANON_KEY }}" `
            -FailOnCheck

      - name: Build signed Android App Bundle
        env:
          ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab

  publish-play:
    if: ${{ inputs.publish_to_play == true }}
    runs-on: ubuntu-latest
    needs: build-aab
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: release

      - name: Validate Play secret
        run: |
          test -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" || (echo "Missing secret: PLAY_SERVICE_ACCOUNT_JSON" && exit 1)

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Must match android/app/build.gradle applicationId.
          packageName: com.victorhaegeman.barly
          releaseFiles: release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
