name: barly
description: Barly app
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter: { sdk: flutter }
  supabase_flutter: ^2.3.4
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # Workaround: google_fonts 6.2.x uses a const Map with FontWeight keys, which
  # fails in Dart 3.11+ (const map keys require primitive equality). We vendor
  # a patched copy until upstream releases a fix.
  google_fonts:
    path: third_party/google_fonts_patched
  flutter_svg: ^2.0.9
  geolocator: ^12.0.0
  carousel_slider: ^5.0.0
  google_maps_flutter: ^2.10.1
  image_picker: ^1.0.7
  crypto: ^3.0.6
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/


